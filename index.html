// ─── DESIGN TOKENS (Lovefrom / clean) ────────────────────────
const T = {
  bg:      "#F6F6F4",
  surface: "#FFFFFF",
  border:  "#E4E4E0",
  text:    "#0F0F0F",
  muted:   "#909090",
  subtle:  "#C0C0BC",
  serif:   "'FeatureDeck', Georgia, serif",
  sans:    "'Sohne', -apple-system, sans-serif",
};

// ─── APP ──────────────────────────────────────────────────────
export default function App() {
  const [tab, setTab]           = useState("plan");
  const [sessions, setSessions] = useState(INIT_SESSIONS);
  const [library, setLibrary]   = useState(INIT_LIBRARY);
  const [rules, setRules]       = useState(INIT_RULES);
  const [openMenu, setOpenMenu] = useState(null);
  const [modal, setModal]       = useState(null);
  const [expanded, setExpanded] = useState({});
  const [opDate, setOpDate]     = useState("2026-04-28");
  const [storageLoaded, setStorageLoaded] = useState(false);

  // ── Load all state from storage on mount (runs once) ──
  useEffect(() => {
    (async () => {
      try { const s = await store.get("sessions"); if (s) setSessions(JSON.parse(s.value)); } catch(e) {}
      try { const l = await store.get("library");  if (l) setLibrary(JSON.parse(l.value));  } catch(e) {}
      try { const r = await store.get("rules");    if (r) setRules(JSON.parse(r.value));    } catch(e) {}
      try { const d = await store.get("opDate");   if (d) setOpDate(d.value);               } catch(e) {}
      try { const c = await store.get(`checks:${new Date().toISOString().slice(0,10)}`); if (c) setChecked(JSON.parse(c.value)); } catch(e) {}
      try { const h = await store.get("history");  if (h) setHistory(JSON.parse(h.value));  } catch(e) {}
      setStorageLoaded(true);
    })();
  }, []); // empty array = runs once on mount only

  // ── Storage helpers with localStorage fallback ──
  const store = {
    get: async (key) => {
      try { if (window.storage) return await window.storage.get(key); } catch(e) {}
      try { const v = localStorage.getItem(key); if (v) return { value: v }; } catch(e) {}
      return null;
    },
    set: async (key, val) => {
      try { if (window.storage) await window.storage.set(key, val); } catch(e) {}
      try { localStorage.setItem(key, val); } catch(e) {}
    },
    del: async (key) => {
      try { if (window.storage) await window.storage.delete(key); } catch(e) {}
      try { localStorage.removeItem(key); } catch(e) {}
    }
  };

  const saveSessions = (updater) => {
    setSessions(prev => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      store.set("sessions", JSON.stringify(next));
      return next;
    });
  };
  const saveLibrary = (updater) => {
    setLibrary(prev => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      store.set("library", JSON.stringify(next));
      return next;
    });
  };
  const saveRules = (val) => {
    setRules(val);
    store.set("rules", JSON.stringify(val));
  };
  const saveOpDate = (val) => {
    setOpDate(val);
    store.set("opDate", val);
  };
  const currentWeek = Math.max(1, Math.ceil((Date.now() - new Date(opDate).getTime()) / (7 * 24 * 60 * 60 * 1000)));
  const isUnlocked  = (week) => (week ?? 1) <= currentWeek;

  // ── daily check tracking ──
  const todayKey = () => new Date().toISOString().slice(0,10);
  const [checked, setChecked] = useState({});
  const [history, setHistory] = useState([]);

  const saveChecks = (newChecked, allExs) => {
    store.set(`checks:${todayKey()}`, JSON.stringify(newChecked));
    const total = allExs.filter(e => !e.hidden).length;
    const done  = Object.keys(newChecked).length;
    const today = todayKey();
    setHistory(h => {
      const next = [...h.filter(x => x.date !== today), { date: today, total, done }].slice(-14);
      store.set("history", JSON.stringify(next));
      return next;
    });
  };

  const toggleCheck = (exId) => {
    const allExs = sessions.flatMap(s => s.exercises);
    setChecked(prev => {
      const next = {...prev};
      if (next[exId]) delete next[exId]; else next[exId] = true;
      saveChecks(next, allExs);
      return next;
    });
  };

  const resetDay = () => {
    setChecked({});
    store.del(`checks:${todayKey()}`);
  };

  // Total progress
  const allVisible = sessions.flatMap(s => s.exercises.filter(e => !e.hidden));
  const totalDone  = allVisible.filter(e => checked[e.id]).length;
  const totalAll   = allVisible.length;

  // ── session helpers ──
  const updateSession = (sid, patch) =>
    saveSessions(s => s.map(sess => sess.id === sid ? {...sess, ...patch} : sess));
  const moveSession   = (sid, dir) =>
    saveSessions(s => { const i = s.findIndex(x => x.id === sid); if (i+dir < 0 || i+dir >= s.length) return s; const a=[...s]; [a[i],a[i+dir]]=[a[i+dir],a[i]]; return a; });
  const removeSession = (sid) => saveSessions(s => s.filter(x => x.id !== sid));

  // ── exercise helpers ──
  const updateEx = (sid, eid, patch) =>
    saveSessions(s => s.map(sess => sess.id !== sid ? sess : {...sess, exercises: sess.exercises.map(e => e.id !== eid ? e : {...e,...patch})}));
  const moveEx = (sid, eid, dir) =>
    saveSessions(s => s.map(sess => {
      if (sess.id !== sid) return sess;
      const exs = [...sess.exercises]; const i = exs.findIndex(e => e.id === eid);
      if (i+dir < 0 || i+dir >= exs.length) return sess;
      [exs[i], exs[i+dir]] = [exs[i+dir], exs[i]]; return {...sess, exercises: exs};
    }));
  const removeEx   = (sid, eid) => saveSessions(s => s.map(sess => sess.id !== sid ? sess : {...sess, exercises: sess.exercises.filter(e => e.id !== eid)}));
  const addEx      = (sid, ex) => saveSessions(s => s.map(sess => sess.id !== sid ? sess : {...sess, exercises: [...sess.exercises, {...ex, id:`ex_${Date.now()}`}]}));

  const updateArtromot = (sid, patch) =>
    saveSessions(s => s.map(sess => sess.id === sid ? {...sess, artromot_min: patch.min ?? sess.artromot_min ?? 45, artromot_deg: patch.deg ?? sess.artromot_deg ?? 96} : sess));
  const updateLib = (lid, patch) => saveLibrary(l => l.map(x => x.id === lid ? {...x,...patch} : x));
  const addToLib  = (ex) => saveLibrary(l => [...l, {...ex, id:`lib_${Date.now()}`}]);
  const removeFromLib = (lid) => saveLibrary(l => l.filter(x => x.id !== lid));
  const toggleExpand = (id) => setExpanded(e => ({...e, [id]: !e[id]}));

  // ── modal helpers ──
  const openModal = (type, data) => { setModal({type, data}); setOpenMenu(null); };
  const closeModal = () => setModal(null);

  const c = (col) => C[col] || C.blue;

  return (
    <div style={{ background:"#F5F5F0", minHeight:"100vh", fontFamily:"'Sohne',-apple-system,sans-serif", maxWidth:480, margin:"0 auto" }}>

      <style>{FONT_CSS}</style>

      {/* ── HERO ── */}
      <div style={{ background:"#fff", padding:"60px 24px 28px", borderBottom:"1px solid #E8E8E4" }}>
        <div style={{ fontSize:10, fontWeight:500, letterSpacing:"2.5px", textTransform:"uppercase", color:"#AAAAAA", marginBottom:20 }}>
          Post-OP · Linke Schulter
        </div>
        <div style={{ fontFamily:T.serif, fontSize:52, fontWeight:300, letterSpacing:"-3px", lineHeight:.92, color:T.text, marginBottom:8 }}>
          Schulter<br/><em style={{ fontStyle:"italic", color:T.muted }}>Reha</em>
        </div>
        <div style={{ fontFamily:T.sans, fontSize:11, color:T.muted, letterSpacing:"0.3px", marginBottom:32 }}>
          Akromioplastik · Kapselreleasing · Bizeps-Tenotomie
        </div>

        {/* OP Date */}
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", paddingTop:18, borderTop:"1px solid #E8E8E4", marginBottom:20 }}>
          <div>
            <div style={{ fontSize:10, letterSpacing:"1.5px", textTransform:"uppercase", color:"#AAAAAA", marginBottom:5 }}>OP-Datum</div>
            <input type="date" value={opDate} onChange={e => saveOpDate(e.target.value)}
              style={{ border:"none", background:"none", fontSize:15, fontWeight:400, color:"#111", padding:0, cursor:"pointer", letterSpacing:"-0.2px" }} />
          </div>
          <div style={{ textAlign:"right" }}>
            <div style={{ fontSize:36, fontWeight:200, letterSpacing:"-2px", color:"#111", lineHeight:1 }}>W{currentWeek}</div>
            <div style={{ fontSize:10, color:"#AAAAAA", letterSpacing:"1.5px", textTransform:"uppercase", marginTop:2 }}>aktuell</div>
          </div>
        </div>

        {/* Color legend */}
        <div style={{ display:"flex", flexWrap:"wrap", gap:14 }}>
          {Object.entries(C).map(([key, val]) => (
            <div key={key} style={{ display:"flex", alignItems:"center", gap:6 }}>
              <div style={{ width:5, height:5, borderRadius:"50%", background:val.bg }} />
              <span style={{ fontSize:11, color:"#AAAAAA", letterSpacing:"0.3px" }}>{val.label}</span>
            </div>
          ))}
        </div>
      </div>

      {/* ── TABS ── */}
      <div style={{ display:"flex", background:"#fff", borderBottom:"1px solid #E5E5EA" }}>
        {[{id:"plan",label:"Tagesplan"},{id:"exercises",label:"Übungen"},{id:"verlauf",label:"Verlauf"}].map(t => (
          <button key={t.id} onClick={() => setTab(t.id)}
            style={{ flex:1, padding:"12px", fontSize:14, fontWeight:600, background:"none", border:"none", borderBottom: tab===t.id ? "2px solid #2C6EAD" : "2px solid transparent", color: tab===t.id ? "#2C6EAD" : "#8E8E93", cursor:"pointer", fontFamily:"'Söhne', 'Söhne-Buch', -apple-system, BlinkMacSystemFont, 'Inter', sans-serif" }}>
            {t.label}
          </button>
        ))}
      </div>

      {/* ══ TAGESPLAN TAB ══════════════════════════════════════ */}
      {tab === "plan" && (
        <div style={{ paddingBottom:40 }}>

          {/* GRUNDREGELN */}
          <div style={{ margin:"0", padding:"24px 24px 0" }}>
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:8 }}>
              <div style={{ fontSize:13, fontWeight:700, textTransform:"uppercase", letterSpacing:.5, color:"#3C3C43" }}>Grundregeln</div>
              <button onClick={() => openModal("rules", {})} style={iconBtn}>✏️</button>
            </div>
            <div style={{ background:"#fff", borderLeft:"2px solid #E8E8E4" }}>
              {rules.map((r, i) => (
                <div key={i} style={{ display:"flex", gap:10, padding:"9px 14px", borderBottom: i < rules.length-1 ? "1px solid #E5E5EA" : "none", alignItems:"baseline" }}>
                  <div style={{ width:5, height:5, background:"#FF9500", borderRadius:"50%", flexShrink:0, marginTop:7 }} />
                  <div style={{ fontSize:14, color:"#000", lineHeight:1.5 }}
                    dangerouslySetInnerHTML={{ __html: r.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>") }} />
                </div>
              ))}
            </div>
          </div>

          {/* DAILY PROGRESS */}
          <div style={{ margin:"0", background:"#fff", padding:"20px 24px", borderBottom:"1px solid #E8E8E4" }}>
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:8 }}>
              <div>
                <div style={{ fontSize:10, letterSpacing:"1.5px", textTransform:"uppercase", color:"#AAAAAA" }}>Heute erledigt</div>
                <div style={{ fontSize:12, color:"#8E8E93" }}>{new Date().toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"})}</div>
              </div>
              <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                <div style={{ fontSize:22, fontWeight:700, color: totalDone===totalAll && totalAll>0 ? "#1A8A6B" : "#2C6EAD" }}>{totalDone}<span style={{ fontSize:14, color:"#8E8E93", fontWeight:400 }}>/{totalAll}</span></div>
                <button onClick={resetDay} style={{ background:"#F2F2F7", border:"none", borderRadius:8, padding:"5px 10px", fontSize:12, color:"#8E8E93", cursor:"pointer" }}>Reset</button>
              </div>
            </div>
            <div style={{ background:"#F0F0EC", borderRadius:999, height:2, overflow:"hidden" }}>
              <div style={{ background: totalDone===totalAll && totalAll>0 ? "#1A8A6B" : "#2C6EAD", height:"100%", borderRadius:999, width:`${totalAll>0?(totalDone/totalAll)*100:0}%`, transition:"width .4s ease" }} />
            </div>
            {totalDone===totalAll && totalAll>0 && <div style={{ fontSize:13, color:"#1A8A6B", fontWeight:600, marginTop:8, textAlign:"center" }}>🎉 Alle Übungen heute erledigt!</div>}
          </div>

          {/* SESSIONS */}
          <div style={{ marginTop:0 }}>
            {sessions.map((sess, si) => (
              <div key={sess.id} style={{ margin:"0 0 1px 0", overflow:"hidden", background:"#fff", borderBottom:"1px solid #E8E8E4" }}>

                {/* Session Header */}
                {(() => {
                  const sc = SESSION_COLORS[sess.id] || SESSION_COLORS.morning;
                  return (
                    <div style={{ background:"#fff", padding:"22px 24px 16px", borderLeft:`3px solid ${sc.bg}`, display:"flex", alignItems:"center", justifyContent:"space-between" }}>
                      <div>
                        <div style={{ fontSize:32, fontWeight:200, letterSpacing:"-1.5px", color:"#111", lineHeight:1, marginBottom:4 }}>{sess.time}</div>
                        <div style={{ fontSize:11, letterSpacing:"1px", textTransform:"uppercase", color:"#AAAAAA" }}>{sess.name.split(" · ").slice(1).join(" ")}</div>
                      </div>
                      <div style={{ display:"flex", alignItems:"center", gap:12 }}>
                        <div style={{ fontSize:10, color:"#CCCCCC", letterSpacing:"0.5px" }}>{sess.dur}</div>
                        <button onClick={() => openModal("session", { sess, si, total:sessions.length })}
                          style={{ background:"none", border:"none", color:"#CCCCCC", padding:"4px", fontSize:16, cursor:"pointer", lineHeight:1 }}>⋯</button>
                      </div>
                    </div>
                  );
                })()}

                {/* Session progress */}
                {(() => {
                  const sessDone = sess.exercises.filter(e => !e.hidden && checked[e.id]).length;
                  const sessTotal = sess.exercises.filter(e => !e.hidden).length;
                  if (sessTotal === 0) return null;
                  return (
                    <div style={{ padding:"8px 24px", background:"#fff", borderBottom:"1px solid #F0F0EC", display:"flex", alignItems:"center", gap:12 }}>
                      <div style={{ flex:1, background:"#F0F0EC", borderRadius:999, height:1, overflow:"hidden" }}>
                        <div style={{ background: sessDone===sessTotal ? "#1A8A6B" : "#2C6EAD", height:"100%", borderRadius:999, width:`${(sessDone/sessTotal)*100}%`, transition:"width .3s" }} />
                      </div>
                      <div style={{ fontSize:11, fontWeight:700, color: sessDone===sessTotal ? "#1A8A6B" : "#8E8E93", flexShrink:0 }}>{sessDone}/{sessTotal}</div>
                    </div>
                  );
                })()}
                  <div style={{ display:"flex", alignItems:"center", gap:14, padding:"10px 16px", background:"#F0F6FF", borderBottom:"1px solid #E5E5EA", borderLeft:"3px solid #2C6EAD" }}>
                    <div style={{ flex:1 }}>
                      <div style={{ fontSize:14, fontWeight:700, color:"#2C6EAD" }}>Artromot</div>
                      <div style={{ fontSize:12, color:"#8E8E93", marginTop:1 }}>Entspannen – Gerät macht die Arbeit</div>
                    </div>
                    <div style={{ display:"flex", gap:14, alignItems:"center" }}>
                      <div style={{ textAlign:"center" }}>
                        <strong style={{ display:"block", fontSize:19, fontWeight:700, color:"#2C6EAD", lineHeight:1 }}>{sess.artromot_min ?? 45}'</strong>
                        <em style={{ fontSize:10, color:"#8E8E93", fontStyle:"normal" }}>Min</em>
                      </div>
                      <div style={{ textAlign:"center" }}>
                        <strong style={{ display:"block", fontSize:19, fontWeight:700, color:"#2C6EAD", lineHeight:1 }}>{sess.artromot_deg ?? 96}°</strong>
                        <em style={{ fontSize:10, color:"#8E8E93", fontStyle:"normal" }}>steigern</em>
                      </div>
                      <button onClick={() => openModal("artromot", { sess })}
                        style={{ background:"none", border:"none", fontSize:20, cursor:"pointer", color:"#C6C6C8", padding:"0 2px", lineHeight:1, letterSpacing:-1 }}>⋮</button>
                    </div>
                  </div>
                )}

                {/* Exercise Rows */}
                <div style={{ background:"#fff" }}>
                  {sess.exercises.map((ex, ei) => {
                    const isExpanded = expanded[ex.id];
                    const col = c(ex.color);
                    return (
                    <div key={ex.id}>
                      <div
                        onClick={() => !ex.hidden && !openMenu && toggleExpand(ex.id)}
                        style={{ display:"flex", alignItems:"center", gap:12, padding:"14px 20px", borderBottom: openMenu?.exId === ex.id ? "none" : `1px solid ${T.border}`, background: ex.hidden ? "#FAFAF8" : "#fff", opacity: ex.hidden ? .45 : 1, cursor: ex.hidden ? "default" : "pointer" }}>
                        {/* Check button - stops propagation */}
                        <div onClick={e => { e.stopPropagation(); !ex.hidden && toggleCheck(ex.id); }}
                          style={{ width:28, height:28, borderRadius:"50%", background: checked[ex.id] ? "#2A7A5A" : ex.hidden ? T.border : col.bg, display:"flex", alignItems:"center", justifyContent:"center", fontSize: checked[ex.id] ? 13 : 9, fontWeight:600, color:"#fff", flexShrink:0, cursor: ex.hidden ? "default" : "pointer", transition:"background .2s" }}>
                          {checked[ex.id] ? "✓" : ex.hidden ? "" : ex.num}
                        </div>
                        <div style={{ flex:1, minWidth:0 }}>
                          <div style={{ fontFamily:T.serif, fontSize:16, fontWeight:300, color: ex.hidden ? T.muted : T.text, letterSpacing:"-0.2px", lineHeight:1.2, textDecoration: ex.hidden ? "line-through" : "none" }}>
                            {ex.name}
                          </div>
                          {!ex.hidden && !isExpanded && ex.desc && (
                            <div style={{ fontFamily:T.sans, fontSize:11, color:T.muted, marginTop:3, lineHeight:1.5, letterSpacing:"0.1px", overflow:"hidden", whiteSpace:"nowrap", textOverflow:"ellipsis" }}>{ex.desc}</div>
                          )}
                          {ex.hidden && <div style={{ fontFamily:T.sans, fontSize:11, color:T.subtle, marginTop:2 }}>ausgeblendet</div>}
                        </div>
                        <div style={{ display:"flex", alignItems:"center", gap:8, flexShrink:0 }}>
                          {!ex.hidden && (
                            <div style={{ fontFamily:T.sans, fontSize:10, color:T.muted, letterSpacing:"0.3px", textAlign:"right", lineHeight:1.3 }}>{ex.reps}</div>
                          )}
                          <button onClick={e => { e.stopPropagation(); setOpenMenu(openMenu?.exId === ex.id ? null : { sessionId:sess.id, exId:ex.id, ei, total:sess.exercises.length }); }}
                            style={{ background:"none", border:"none", fontSize:16, cursor:"pointer", color:T.subtle, padding:"0 2px", lineHeight:1 }}>⋯</button>
                        </div>
                      </div>

                      {/* Expanded description */}
                      {isExpanded && !ex.hidden && (
                        <div style={{ padding:"12px 20px 16px 60px", background:"#FAFAF8", borderBottom:`1px solid ${T.border}` }}>
                          <div style={{ fontFamily:T.sans, fontSize:13, color:"#444", lineHeight:1.7, letterSpacing:"0.1px", marginBottom:8 }}>{ex.desc}</div>
                          <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                            <div style={{ fontFamily:T.sans, fontSize:11, fontWeight:400, background:col.bg, color:"#fff", borderRadius:4, padding:"3px 8px", letterSpacing:"0.3px" }}>{ex.reps}</div>
                            {ex.priority && <div style={{ fontFamily:T.sans, fontSize:11, color:T.muted, letterSpacing:"0.2px" }}>Priorität</div>}
                            {(ex.approvedPhysio || ex.approvedDoc) && (
                              <>
                                {ex.approvedPhysio && <div style={{ fontFamily:T.sans, fontSize:11, color:"#2A7A5A", letterSpacing:"0.2px" }}>✓ Physio</div>}
                                {ex.approvedDoc    && <div style={{ fontFamily:T.sans, fontSize:11, color:"#2A7A5A", letterSpacing:"0.2px" }}>✓ Arzt</div>}
                              </>
                            )}
                          </div>
                        </div>
                      )}

                      {/* Inline action strip */}
                      {openMenu?.exId === ex.id && (
                        <div style={{ display:"flex", background:"#F2F2F7", borderBottom:"1px solid #E5E5EA" }}>
                          {[
                            { icon: ex.hidden ? "👁":"🙈", fn:() => { updateEx(sess.id,ex.id,{hidden:!ex.hidden}); setOpenMenu(null); } },
                            { icon:"⭐", fn:() => { updateEx(sess.id,ex.id,{priority:!ex.priority}); setOpenMenu(null); }, highlight:ex.priority, skip:ex.hidden },
                            { icon:"✏️", fn:() => openModal("exercise", { sess, ex }), skip:ex.hidden },
                            { icon:"↑", fn:() => { moveEx(sess.id,ex.id,-1); setOpenMenu(null); }, disabled:ei===0 },
                            { icon:"↓", fn:() => { moveEx(sess.id,ex.id,1);  setOpenMenu(null); }, disabled:ei===openMenu.total-1 },
                            { icon:"🗑", fn:() => { removeEx(sess.id,ex.id); setOpenMenu(null); }, danger:true },
                          ].filter(b => !b.skip).map((btn, bi, arr) => (
                            <button key={bi} onClick={btn.fn} disabled={btn.disabled}
                              style={{ flex:1, padding:"11px 0", background: btn.highlight?"#FFF0C0": btn.danger?"#FFF0F0":"none", border:"none", fontSize:17, cursor:btn.disabled?"default":"pointer", opacity:btn.disabled?.3:1, borderRight: bi<arr.length-1?"1px solid #E5E5EA":"none" }}>
                              {btn.icon}
                            </button>
                          ))}
                        </div>
                      )}
                    </div>
                  );})}

                  {/* Add – from library or manual */}
                  <button onClick={() => openModal("pickEx", { sessId:sess.id })}
                    style={{ width:"100%", padding:"11px", background:"#F9F9F9", border:"none", borderTop:"1px solid #E5E5EA", fontSize:14, color:"#007AFF", fontWeight:600, cursor:"pointer" }}>
                    + Übung hinzufügen
                  </button>

                  {/* Pendeln */}
                  <div style={{ display:"flex", alignItems:"center", gap:10, padding:"9px 16px", background:"#EDFAF1", borderTop:"1px solid #E5E5EA" }}>
                    <div style={{ width:7, height:7, background:"#34C759", borderRadius:"50%", flexShrink:0 }} />
                    <div style={{ fontSize:13, fontWeight:600, color:"#1A8738", flex:1 }}>Pendeln</div>
                    <div style={{ fontSize:11, color:"#8E8E93" }}>{sess.pendeln}</div>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* ══ VERLAUF TAB ════════════════════════════════════════ */}
      {tab === "verlauf" && (
        <div style={{ padding:"20px 16px 40px" }}>
          <div style={{ fontSize:20, fontWeight:700, marginBottom:16, color:"#000" }}>Verlauf</div>

          {/* Today summary */}
          <div style={{ background:"#fff", borderRadius:14, padding:"16px", marginBottom:12, boxShadow:"0 1px 4px rgba(0,0,0,.07)" }}>
            <div style={{ fontSize:12, fontWeight:700, color:"#8E8E93", textTransform:"uppercase", letterSpacing:.5, marginBottom:8 }}>Heute</div>
            <div style={{ display:"flex", alignItems:"center", gap:14 }}>
              <div style={{ position:"relative", width:64, height:64, flexShrink:0 }}>
                <svg width="64" height="64" viewBox="0 0 64 64">
                  <circle cx="32" cy="32" r="27" fill="none" stroke="#E5E5EA" strokeWidth="6"/>
                  <circle cx="32" cy="32" r="27" fill="none"
                    stroke={totalDone===totalAll && totalAll>0 ? "#1A8A6B" : "#2C6EAD"}
                    strokeWidth="6" strokeLinecap="round"
                    strokeDasharray={`${totalAll>0?(totalDone/totalAll)*170:0} 170`}
                    transform="rotate(-90 32 32)" style={{ transition:"stroke-dasharray .5s" }}/>
                </svg>
                <div style={{ position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center", fontSize:13, fontWeight:700, color:"#000" }}>{totalAll>0?Math.round((totalDone/totalAll)*100):0}%</div>
              </div>
              <div>
                <div style={{ fontSize:22, fontWeight:700, color:"#000" }}>{totalDone} <span style={{ fontSize:14, color:"#8E8E93", fontWeight:400 }}>von {totalAll}</span></div>
                <div style={{ fontSize:13, color:"#8E8E93" }}>Übungen erledigt</div>
                {totalDone===totalAll && totalAll>0 && <div style={{ fontSize:13, color:"#1A8A6B", fontWeight:600, marginTop:4 }}>🎉 Alles geschafft!</div>}
              </div>
            </div>
          </div>

          {/* Sessions breakdown */}
          <div style={{ background:"#fff", borderRadius:14, overflow:"hidden", marginBottom:12, boxShadow:"0 1px 4px rgba(0,0,0,.07)" }}>
            <div style={{ padding:"12px 16px", fontSize:12, fontWeight:700, color:"#8E8E93", textTransform:"uppercase", letterSpacing:.5, borderBottom:"1px solid #E5E5EA" }}>Pro Session</div>
            {sessions.map(sess => {
              const sessDone = sess.exercises.filter(e => !e.hidden && checked[e.id]).length;
              const sessTotal = sess.exercises.filter(e => !e.hidden).length;
              const sc = SESSION_COLORS[sess.id] || SESSION_COLORS.morning;
              return (
                <div key={sess.id} style={{ display:"flex", alignItems:"center", gap:12, padding:"11px 16px", borderBottom:"1px solid #E5E5EA" }}>
                  <div style={{ width:8, height:8, borderRadius:"50%", background:sc.bg, flexShrink:0 }} />
                  <div style={{ flex:1 }}>
                    <div style={{ fontSize:13, fontWeight:600, color:"#000" }}>{sess.time} · {sess.name.split("·")[1]?.trim()}</div>
                    <div style={{ background:"#F2F2F7", borderRadius:999, height:4, marginTop:4, overflow:"hidden" }}>
                      <div style={{ background: sessDone===sessTotal && sessTotal>0 ? "#1A8A6B" : sc.bg, height:"100%", borderRadius:999, width:`${sessTotal>0?(sessDone/sessTotal)*100:0}%`, transition:"width .3s" }} />
                    </div>
                  </div>
                  <div style={{ fontSize:12, fontWeight:700, color: sessDone===sessTotal && sessTotal>0 ? "#1A8A6B" : "#8E8E93" }}>{sessDone}/{sessTotal}</div>
                </div>
              );
            })}
          </div>

          {/* History */}
          {history.length > 1 && (
            <div style={{ background:"#fff", borderRadius:14, overflow:"hidden", boxShadow:"0 1px 4px rgba(0,0,0,.07)" }}>
              <div style={{ padding:"12px 16px", fontSize:12, fontWeight:700, color:"#8E8E93", textTransform:"uppercase", letterSpacing:.5, borderBottom:"1px solid #E5E5EA" }}>Letzte Tage</div>
              {[...history].reverse().filter(h => h.date !== todayKey()).slice(0,7).map((h, i) => {
                const pct = h.total > 0 ? Math.round((h.done/h.total)*100) : 0;
                const d = new Date(h.date);
                return (
                  <div key={h.date} style={{ display:"flex", alignItems:"center", gap:12, padding:"10px 16px", borderBottom:"1px solid #E5E5EA" }}>
                    <div style={{ width:36, textAlign:"center" }}>
                      <div style={{ fontSize:11, color:"#8E8E93" }}>{d.toLocaleDateString("de-DE",{weekday:"short"})}</div>
                      <div style={{ fontSize:13, fontWeight:700, color:"#000" }}>{d.getDate()}.{d.getMonth()+1}.</div>
                    </div>
                    <div style={{ flex:1 }}>
                      <div style={{ background:"#F2F2F7", borderRadius:999, height:6, overflow:"hidden" }}>
                        <div style={{ background: pct===100 ? "#1A8A6B" : "#2C6EAD", height:"100%", borderRadius:999, width:`${pct}%` }} />
                      </div>
                    </div>
                    <div style={{ fontSize:13, fontWeight:700, color: pct===100 ? "#1A8A6B" : "#8E8E93", width:36, textAlign:"right" }}>{pct}%</div>
                  </div>
                );
              })}
            </div>
          )}

          {history.length === 0 && (
            <div style={{ textAlign:"center", padding:"40px 20px", color:"#8E8E93", fontSize:14 }}>
              Noch kein Verlauf gespeichert.<br/>Hake heute Übungen ab um zu starten.
            </div>
          )}
        </div>
      )}

      {/* ══ ÜBUNGEN TAB ════════════════════════════════════════ */}
      {tab === "exercises" && (
        <div style={{ paddingBottom:40 }}>
          {Object.entries(C).map(([colorKey, colorVal]) => {
            const items = library.filter(x => x.color === colorKey);
            if (!items.length) return null;
            return (
              <div key={colorKey} style={{ margin:"0", padding:"24px 24px 0" }}>
                {/* Category header */}
                <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:8 }}>
                  <div style={{ width:10, height:10, borderRadius:"50%", background:colorVal.bg, flexShrink:0 }} />
                  <div style={{ fontSize:18, fontWeight:700, color:"#000" }}>{colorVal.label}</div>
                </div>

                {items.map((ex, i) => {
                  const unlocked = isUnlocked(ex.week ?? 1);
                  return (
                  <div key={ex.id} style={{ background:"#fff", borderRadius:12, marginBottom:2, overflow:"hidden", boxShadow:"0 1px 3px rgba(0,0,0,.06)", opacity: unlocked ? 1 : .55 }}>
                    {/* Collapsed header */}
                    <div style={{ display:"flex", alignItems:"center", gap:10, padding:"12px 14px", cursor: unlocked ? "pointer" : "default" }}
                      onClick={() => unlocked && toggleExpand(ex.id)}>
                      <div style={{ width:28, height:28, borderRadius:8, background: unlocked ? colorVal.bg : "#C6C6C8", display:"flex", alignItems:"center", justifyContent:"center", fontSize:10, fontWeight:800, color:"#fff", flexShrink:0 }}>{unlocked ? ex.num : "🔒"}</div>
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ fontSize:15, fontWeight:600, color: unlocked ? "#000" : "#8E8E93" }}>{ex.name}</div>
                        {!expanded[ex.id] && (
                          <div style={{ fontSize:12, color:"#8E8E93", marginTop:1, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>
                            {unlocked ? ex.short : `Verfügbar ab Woche ${ex.week ?? 1} · aktuell Woche ${currentWeek}`}
                          </div>
                        )}
                      </div>
                      <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                        {!unlocked && <div style={{ fontSize:11, fontWeight:700, background:"#E5E5EA", color:"#8E8E93", borderRadius:6, padding:"2px 8px", whiteSpace:"nowrap" }}>Wo. {ex.week}</div>}
                        {unlocked && <div style={{ fontSize:18, color:"#C6C6C8", flexShrink:0, transform: expanded[ex.id]?"rotate(90deg)":"none", transition:"transform .2s" }}>›</div>}
                      </div>
                    </div>

                    {/* Expanded detail – only if unlocked */}
                    {expanded[ex.id] && unlocked && (
                      <div style={{ borderTop:"1px solid #E5E5EA" }}>
                        <div style={{ margin:"12px 14px 0", background:"#F2F2F7", borderRadius:10, height:120, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:4, cursor:"pointer" }}
                          onClick={() => alert("Foto-Funktion in Kürze verfügbar")}>
                          {ex.photo
                            ? <img src={ex.photo} alt="" style={{ width:"100%", height:"100%", objectFit:"cover", borderRadius:10 }} />
                            : <><div style={{ fontSize:28, color:"#C6C6C8" }}>📷</div><div style={{ fontSize:12, color:"#C6C6C8" }}>Foto hinzufügen</div></>}
                        </div>
                        <div style={{ padding:"12px 14px 0", fontSize:14, color:"#000", lineHeight:1.6 }}>{ex.detail}</div>
                        <div style={{ padding:"10px 14px 0" }}>
                          {ex.tips.map((tip, ti) => (
                            <div key={ti} style={{ display:"flex", gap:8, marginBottom:5, alignItems:"baseline" }}>
                              <div style={{ width:4, height:4, background:"#2C6EAD", borderRadius:"50%", flexShrink:0, marginTop:7 }} />
                              <div style={{ fontSize:13, color:"#3C3C43" }}>{tip}</div>
                            </div>
                          ))}
                        </div>
                        <div style={{ display:"flex", gap:8, margin:"12px 14px" }}>
                          <button onClick={() => openModal("libEx", { ex })}
                            style={{ flex:1, padding:"10px", background:"#F2F2F7", border:"none", borderRadius:10, fontSize:14, color:"#2C6EAD", fontWeight:600, cursor:"pointer" }}>✏️ Bearbeiten</button>
                          <button onClick={() => { if(window.confirm("Übung aus Bibliothek entfernen?")) removeFromLib(ex.id); }}
                            style={{ padding:"10px 14px", background:"#FFF0F0", border:"none", borderRadius:10, fontSize:14, color:"#FF3B30", cursor:"pointer" }}>🗑</button>
                        </div>
                      </div>
                    )}
                  </div>
                  );
                })}
              </div>
            );
          })}
          <div style={{ margin:"16px 16px 0" }}>
            <button onClick={() => openModal("addLibEx", {})}
              style={{ width:"100%", padding:"13px", background:"#fff", border:"none", borderRadius:12, fontSize:15, color:"#007AFF", fontWeight:600, cursor:"pointer", boxShadow:"0 1px 3px rgba(0,0,0,.06)" }}>
              + Neue Übung zur Bibliothek hinzufügen
            </button>
          </div>
          <div style={{ height:32 }} />
        </div>
      )}

      {/* ══ MODALS ═════════════════════════════════════════════ */}
      {modal && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,.5)", display:"flex", alignItems:"flex-end", justifyContent:"center", zIndex:100, padding:16 }}
          onClick={e => { if(e.target===e.currentTarget) closeModal(); }}>
          <div style={{ background:"#fff", borderRadius:20, padding:24, width:"100%", maxWidth:480, maxHeight:"85vh", overflowY:"auto" }}>

            {/* PICK EXERCISE FROM LIBRARY */}
            {modal.type === "pickEx" && (
              <PickExModal library={library} C={C} currentWeek={currentWeek}
                onPick={ex => { addEx(modal.data.sessId, {...ex, priority:false, hidden:false}); closeModal(); }}
                onManual={() => { setModal({type:"addEx", data:{sessId:modal.data.sessId}}); }}
                onClose={closeModal} />
            )}

            {/* ADD TO LIBRARY */}
            {modal.type === "addLibEx" && (
              <LibExModal ex={{ num:"", color:"blue", name:"", short:"", detail:"", tips:[], photo:null }}
                onSave={ex => { addToLib(ex); closeModal(); }}
                onClose={closeModal} />
            )}

            {/* ARTROMOT MODAL */}
            {modal.type === "artromot" && (
              <ArtroModal sess={modal.data.sess}
                onSave={(min, deg) => {
                  saveSessions(s => s.map(x => x.id === modal.data.sess.id ? {...x, artromot_min:min, artromot_deg:deg} : x));
                  closeModal();
                }}
                onClose={closeModal} />
            )}

            {/* RULES MODAL */}
            {modal.type === "rules" && (
              <RulesModal rules={rules} onSave={r => { saveRules(r); closeModal(); }} onClose={closeModal} />
            )}

            {/* SESSION MODAL */}
            {modal.type === "session" && (
              <SessionModal sess={modal.data.sess} si={modal.data.si} total={modal.data.total}
                onSave={patch => { updateSession(modal.data.sess.id, patch); closeModal(); }}
                onMoveUp={() => { moveSession(modal.data.sess.id,-1); closeModal(); }}
                onMoveDown={() => { moveSession(modal.data.sess.id,1); closeModal(); }}
                onDelete={() => { removeSession(modal.data.sess.id); closeModal(); }}
                onClose={closeModal} />
            )}

            {/* EXERCISE MODAL (tagesplan) */}
            {modal.type === "exercise" && (
              <ExModal title="Übung bearbeiten" ex={modal.data.ex}
                onSave={patch => { updateEx(modal.data.sess.id, modal.data.ex.id, patch); closeModal(); }}
                onClose={closeModal} />
            )}

            {modal.type === "addEx" && (
              <ExModal title="Übung hinzufügen" isNew={true}
                ex={{ num:"", color:"blue", name:"", desc:"", reps:"", priority:false, hidden:false, week:1, approvedPhysio:false, approvedDoc:false }}
                onSave={ex => { addEx(modal.data.sessId, ex); closeModal(); }}
                onClose={closeModal} />
            )}

            {/* LIBRARY EXERCISE MODAL */}
            {modal.type === "libEx" && (
              <LibExModal ex={modal.data.ex}
                onSave={patch => { updateLib(modal.data.ex.id, patch); closeModal(); }}
                onClose={closeModal} />
            )}
          </div>
        </div>
      )}
    </div>
  );
}

// ─── SUB-COMPONENTS ───────────────────────────────────────────

function PickExModal({ library, C, currentWeek, onPick, onManual, onClose }) {
  const [search, setSearch] = useState("");
  const filtered = library.filter(ex =>
    ex.name.toLowerCase().includes(search.toLowerCase()) ||
    (ex.short || "").toLowerCase().includes(search.toLowerCase())
  );
  const unlocked = filtered.filter(ex => (ex.week ?? 1) <= currentWeek);
  const locked   = filtered.filter(ex => (ex.week ?? 1) >  currentWeek);
  return (
    <>
      <ModalTitle title="Übung hinzufügen" onClose={onClose} />
      <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Suchen…" style={{ ...input, width:"100%", marginBottom:12 }} />
      <div style={{ maxHeight:380, overflowY:"auto", marginBottom:12 }}>
        {unlocked.length > 0 && (
          <>
            <div style={{ fontSize:11, fontWeight:700, color:"#8E8E93", textTransform:"uppercase", letterSpacing:.5, marginBottom:6 }}>Jetzt verfügbar – Woche {currentWeek}</div>
            {unlocked.map(ex => {
              const col = C[ex.color] || C.blue;
              return (
                <div key={ex.id} onClick={() => onPick(ex)}
                  style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 12px", borderRadius:10, marginBottom:4, background:"#F9F9F9", cursor:"pointer", border:"1px solid #E5E5EA" }}>
                  <div style={{ width:26, height:26, borderRadius:7, background:col.bg, display:"flex", alignItems:"center", justifyContent:"center", fontSize:9, fontWeight:800, color:"#fff", flexShrink:0 }}>{ex.num}</div>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontSize:14, fontWeight:600, color:"#000" }}>{ex.name}</div>
                    <div style={{ fontSize:11, color:"#8E8E93", marginTop:1, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{ex.short}</div>
                  </div>
                </div>
              );
            })}
          </>
        )}
        {locked.length > 0 && (
          <>
            <div style={{ fontSize:11, fontWeight:700, color:"#C6C6C8", textTransform:"uppercase", letterSpacing:.5, marginBottom:6, marginTop:12 }}>Noch gesperrt</div>
            {locked.map(ex => {
              return (
                <div key={ex.id}
                  style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 12px", borderRadius:10, marginBottom:4, background:"#F9F9F9", border:"1px solid #E5E5EA", opacity:.5 }}>
                  <div style={{ width:26, height:26, borderRadius:7, background:"#C6C6C8", display:"flex", alignItems:"center", justifyContent:"center", fontSize:12, flexShrink:0 }}>🔒</div>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontSize:14, fontWeight:600, color:"#8E8E93" }}>{ex.name}</div>
                    <div style={{ fontSize:11, color:"#C6C6C8", marginTop:1 }}>Verfügbar ab Woche {ex.week}</div>
                  </div>
                </div>
              );
            })}
          </>
        )}
        {filtered.length === 0 && <div style={{ fontSize:14, color:"#8E8E93", textAlign:"center", padding:"20px 0" }}>Keine Übung gefunden</div>}
      </div>
      <button onClick={onManual} style={{ ...btnSec, width:"100%" }}>Manuell eingeben</button>
    </>
  );
}

function ArtroModal({ sess, onSave, onClose }) {
  const [min, setMin] = useState(String(sess.artromot_min ?? 45));
  const [deg, setDeg] = useState(String(sess.artromot_deg ?? 96));
  return (
    <>
      <ModalTitle title="Artromot anpassen" onClose={onClose} />
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:16 }}>
        <div>
          <Label>Dauer (Minuten)</Label>
          <input type="number" value={min} onChange={e=>setMin(e.target.value)} style={{...input,width:"100%",fontSize:22,fontWeight:700,textAlign:"center",color:"#007AFF"}} />
        </div>
        <div>
          <Label>Grad (°)</Label>
          <input type="number" value={deg} onChange={e=>setDeg(e.target.value)} style={{...input,width:"100%",fontSize:22,fontWeight:700,textAlign:"center",color:"#007AFF"}} />
        </div>
      </div>
      <div style={{ display:"flex", gap:8 }}>
        <button onClick={() => onSave(Number(min), Number(deg))} style={btnPri}>Speichern</button>
        <button onClick={onClose} style={btnSec}>Abbrechen</button>
      </div>
    </>
  );
}

function RulesModal({ rules, onSave, onClose }) {
  const [list, setList] = useState([...rules]);
  return (
    <>
      <ModalTitle title="Grundregeln bearbeiten" onClose={onClose} />
      {list.map((r, i) => (
        <div key={i} style={{ display:"flex", gap:8, marginBottom:8, alignItems:"center" }}>
          <input value={r} onChange={e => setList(l => l.map((x,j) => j===i ? e.target.value : x))}
            style={{ ...input, flex:1 }} />
          <button onClick={() => setList(l => l.filter((_,j) => j!==i))}
            style={{ background:"#FFF0F0", border:"none", borderRadius:8, padding:"8px 10px", fontSize:14, cursor:"pointer", color:"#FF3B30" }}>🗑</button>
        </div>
      ))}
      <button onClick={() => setList(l => [...l,"Neue Regel"])}
        style={{ ...btnSec, width:"100%", marginBottom:12 }}>+ Regel hinzufügen</button>
      <div style={{ display:"flex", gap:8 }}>
        <button onClick={() => onSave(list)} style={btnPri}>Speichern</button>
        <button onClick={onClose} style={btnSec}>Abbrechen</button>
      </div>
    </>
  );
}

function SessionModal({ sess, si, total, onSave, onMoveUp, onMoveDown, onDelete, onClose }) {
  const [f, setF] = useState({ time:sess.time, name:sess.name, dur:sess.dur, pendeln:sess.pendeln, artromot:sess.artromot });
  return (
    <>
      <ModalTitle title="Session bearbeiten" onClose={onClose} />
      <Label>Uhrzeit</Label><input value={f.time} onChange={e=>setF(x=>({...x,time:e.target.value}))} style={{...input,width:"100%",marginBottom:10}} />
      <Label>Name</Label><input value={f.name} onChange={e=>setF(x=>({...x,name:e.target.value}))} style={{...input,width:"100%",marginBottom:10}} />
      <Label>Dauer</Label><input value={f.dur}  onChange={e=>setF(x=>({...x,dur:e.target.value}))}  style={{...input,width:"100%",marginBottom:10}} />
      <Label>Pendeln Text</Label><input value={f.pendeln} onChange={e=>setF(x=>({...x,pendeln:e.target.value}))} style={{...input,width:"100%",marginBottom:12}} />
      <label style={{ display:"flex", alignItems:"center", gap:8, fontSize:14, marginBottom:16 }}>
        <input type="checkbox" checked={f.artromot} onChange={e=>setF(x=>({...x,artromot:e.target.checked}))} />
        Artromot in dieser Session
      </label>
      <div style={{ display:"flex", gap:8, marginBottom:10 }}>
        <button onClick={onSave.bind(null,f)} style={btnPri}>Speichern</button>
        <button onClick={onClose} style={btnSec}>Abbrechen</button>
      </div>
      <div style={{ display:"flex", gap:8, borderTop:"1px solid #E5E5EA", paddingTop:12 }}>
        <button onClick={onMoveUp}   disabled={si===0}       style={{...btnSec,flex:1,opacity:si===0?.4:1}}>↑ Hoch</button>
        <button onClick={onMoveDown} disabled={si===total-1} style={{...btnSec,flex:1,opacity:si===total-1?.4:1}}>↓ Runter</button>
        <button onClick={onDelete} style={{ flex:1, background:"#FFF0F0", color:"#FF3B30", border:"none", borderRadius:10, padding:12, fontSize:14, fontWeight:600, cursor:"pointer" }}>🗑 Löschen</button>
      </div>
    </>
  );
}

function ExModal({ title, ex, onSave, onClose, isNew }) {
  const [f, setF] = useState({ week:1, approvedPhysio:false, approvedDoc:false, ...ex });
  return (
    <>
      <ModalTitle title={title} onClose={onClose} />

      {/* Warning banner for new manual exercises */}
      {isNew && (
        <div style={{ background:"#FFF8E6", border:"1px solid #FFD60A", borderRadius:10, padding:"10px 12px", marginBottom:14 }}>
          <div style={{ fontSize:13, fontWeight:700, color:"#7A5200", marginBottom:3 }}>⚠️ Manuelle Übung</div>
          <div style={{ fontSize:12, color:"#7A5200", lineHeight:1.5 }}>Manuelle Übungen werden nicht automatisch auf Freigabe geprüft. Bitte nur nach Rücksprache mit Physio oder Arzt hinzufügen und unten bestätigen.</div>
        </div>
      )}

      <div style={{ display:"grid", gridTemplateColumns:"80px 1fr", gap:8, marginBottom:10 }}>
        <div><Label>Kürzel</Label><input value={f.num} onChange={e=>setF(x=>({...x,num:e.target.value}))} style={{...input,width:"100%"}} /></div>
        <div><Label>Farbe</Label>
          <select value={f.color} onChange={e=>setF(x=>({...x,color:e.target.value}))} style={{...input,width:"100%"}}>
            <option value="blue">🔵 Schulter passiv</option>
            <option value="green">🟢 Schulter aktiv</option>
            <option value="purple">🟣 Schulterblatt</option>
            <option value="teal">🩵 Core & Nacken</option>
            <option value="orange">🟠 Hüfte & ISG</option>
          </select>
        </div>
      </div>
      <Label>Name</Label><input value={f.name} onChange={e=>setF(x=>({...x,name:e.target.value}))} style={{...input,width:"100%",marginBottom:10}} />
      <Label>Hinweis / Beschreibung</Label><input value={f.desc} onChange={e=>setF(x=>({...x,desc:e.target.value}))} style={{...input,width:"100%",marginBottom:10}} />
      <Label>Wdh. / Zeit</Label><input value={f.reps} onChange={e=>setF(x=>({...x,reps:e.target.value}))} style={{...input,width:"100%",marginBottom:10}} />

      {/* Week field */}
      <Label>Ab Woche</Label>
      <div style={{ display:"flex", gap:6, marginBottom:14 }}>
        {[1,2,3,4,6,8].map(w => (
          <button key={w} onClick={() => setF(x=>({...x,week:w}))}
            style={{ flex:1, padding:"8px 0", background: f.week===w ? "#2C6EAD" : "#F2F2F7", color: f.week===w ? "#fff" : "#3C3C43", border:"none", borderRadius:8, fontSize:13, fontWeight:700, cursor:"pointer" }}>
            {w}
          </button>
        ))}
      </div>

      {/* Approval checkboxes */}
      <div style={{ background:"#F2F2F7", borderRadius:10, padding:"12px 14px", marginBottom:16 }}>
        <div style={{ fontSize:12, fontWeight:700, color:"#3C3C43", textTransform:"uppercase", letterSpacing:.5, marginBottom:10 }}>Freigabe</div>
        <label style={{ display:"flex", alignItems:"center", gap:10, fontSize:14, marginBottom:10, cursor:"pointer" }}>
          <div style={{ width:22, height:22, borderRadius:6, background: f.approvedPhysio ? "#1A8A6B" : "#fff", border: `2px solid ${f.approvedPhysio ? "#1A8A6B" : "#C6C6C8"}`, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}
            onClick={() => setF(x=>({...x,approvedPhysio:!x.approvedPhysio}))}>
            {f.approvedPhysio && <span style={{ fontSize:13, color:"#fff" }}>✓</span>}
          </div>
          <span>Von <strong>Physio</strong> freigegeben</span>
        </label>
        <label style={{ display:"flex", alignItems:"center", gap:10, fontSize:14, cursor:"pointer" }}>
          <div style={{ width:22, height:22, borderRadius:6, background: f.approvedDoc ? "#1A8A6B" : "#fff", border: `2px solid ${f.approvedDoc ? "#1A8A6B" : "#C6C6C8"}`, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}
            onClick={() => setF(x=>({...x,approvedDoc:!x.approvedDoc}))}>
            {f.approvedDoc && <span style={{ fontSize:13, color:"#fff" }}>✓</span>}
          </div>
          <span>Von <strong>Arzt / Chirurg</strong> freigegeben</span>
        </label>
      </div>

      <label style={{ display:"flex", alignItems:"center", gap:8, fontSize:14, marginBottom:16 }}>
        <input type="checkbox" checked={f.priority} onChange={e=>setF(x=>({...x,priority:e.target.checked}))} />⭐ Als Priorität markieren
      </label>
      <div style={{ display:"flex", gap:8 }}>
        <button onClick={() => onSave(f)} style={btnPri}>Speichern</button>
        <button onClick={onClose} style={btnSec}>Abbrechen</button>
      </div>
    </>
  );
}

function LibExModal({ ex, onSave, onClose }) {
  const [f, setF] = useState({...ex});
  const [newTip, setNewTip] = useState("");
  return (
    <>
      <ModalTitle title="Übung bearbeiten" onClose={onClose} />
      <Label>Name</Label><input value={f.name} onChange={e=>setF(x=>({...x,name:e.target.value}))} style={{...input,width:"100%",marginBottom:10}} />
      <Label>Kurzbeschreibung</Label><input value={f.short} onChange={e=>setF(x=>({...x,short:e.target.value}))} style={{...input,width:"100%",marginBottom:10}} />
      <Label>Detailbeschreibung</Label>
      <textarea value={f.detail} onChange={e=>setF(x=>({...x,detail:e.target.value}))} style={{...input,width:"100%",marginBottom:10,height:80,resize:"vertical"}} />
      <Label>Tipps</Label>
      {f.tips.map((tip,i) => (
        <div key={i} style={{ display:"flex", gap:6, marginBottom:6 }}>
          <input value={tip} onChange={e=>setF(x=>({...x,tips:x.tips.map((t,j)=>j===i?e.target.value:t)}))} style={{...input,flex:1}} />
          <button onClick={()=>setF(x=>({...x,tips:x.tips.filter((_,j)=>j!==i)}))} style={{ background:"#FFF0F0", border:"none", borderRadius:8, padding:"6px 9px", cursor:"pointer", color:"#FF3B30" }}>🗑</button>
        </div>
      ))}
      <div style={{ display:"flex", gap:6, marginBottom:14 }}>
        <input value={newTip} onChange={e=>setNewTip(e.target.value)} placeholder="Neuer Tipp" style={{...input,flex:1}} />
        <button onClick={()=>{if(newTip.trim()){setF(x=>({...x,tips:[...x.tips,newTip.trim()]}));setNewTip("");}}} style={{...btnSec,flexShrink:0}}>+</button>
      </div>
      <div style={{ display:"flex", gap:8 }}>
        <button onClick={() => onSave(f)} style={btnPri}>Speichern</button>
        <button onClick={onClose} style={btnSec}>Abbrechen</button>
      </div>
    </>
  );
}

function ModalTitle({ title, onClose }) {
  return (
    <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:16 }}>
      <div style={{ fontSize:17, fontWeight:700, color:"#000" }}>{title}</div>
      <button onClick={onClose} style={{ background:"#F2F2F7", border:"none", borderRadius:8, padding:"4px 10px", fontSize:14, cursor:"pointer", color:"#3C3C43" }}>✕</button>
    </div>
  );
}

function Label({ children }) {
  return <div style={{ fontSize:11, fontWeight:700, color:"#8E8E93", textTransform:"uppercase", letterSpacing:.5, marginBottom:4 }}>{children}</div>;
}

const input  = { border:"1px solid #E5E5EA", borderRadius:8, padding:"9px 12px", fontSize:14, fontFamily:"'Söhne', 'Söhne-Buch', -apple-system, BlinkMacSystemFont, 'Inter', sans-serif", outline:"none", background:"#fff", color:"#000" };
const btnPri = { flex:1, background:"#007AFF", color:"#fff", border:"none", borderRadius:10, padding:"12px", fontSize:15, fontWeight:700, cursor:"pointer", fontFamily:"'Söhne', 'Söhne-Buch', -apple-system, BlinkMacSystemFont, 'Inter', sans-serif" };
const btnSec = { flex:1, background:"#F2F2F7", color:"#3C3C43", border:"none", borderRadius:10, padding:"12px", fontSize:14, fontWeight:600, cursor:"pointer", fontFamily:"'Söhne', 'Söhne-Buch', -apple-system, BlinkMacSystemFont, 'Inter', sans-serif" };
const iconBtn= { background:"none", border:"1px solid #E8E8E4", borderRadius:4, padding:"4px 8px", fontSize:12, cursor:"pointer", color:"#AAAAAA" };

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
  </script>
